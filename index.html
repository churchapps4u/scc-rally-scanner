<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCC Workshops 2026 Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{font:17px Arial,sans-serif;background:#f3f5f8;color:#162235;margin:0;padding:16px}.card{max-width:560px;margin:10px auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 2px 12px #0001}h1{font-size:24px;margin:0 0 10px}label{display:block;font-weight:bold;margin-top:15px}input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:13px;margin-top:8px;border:1px solid #ccd2dc;border-radius:9px}button{background:#154b83;color:#fff;font-weight:bold;border:0;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#4b5563}button.danger{background:#9f3232}.muted{font-size:14px;color:#596677}.result{border-radius:10px;padding:17px;margin-top:15px;font-weight:bold;text-align:center}.success{background:#d9f3df;color:#155e30}.already{background:#fff1c2;color:#805b00}.error{background:#fbe0e0;color:#912828}#reader{max-width:440px;margin:12px auto}#scannerCard{display:none}
</style></head><body>
<div class="card" id="loginCard"><h1>🔐 SCC Workshops Scanner</h1><p class="muted">Authorized officers only. Workshop registration/check-in pilot.</p><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Sign in</button><div id="loginResult" role="status"></div></div>
<div class="card" id="scannerCard"><h1>📷 SCC QR Scanner</h1><p class="muted" id="officerName"></p><label>Workshop</label><select id="workshop"><option value="PM2026">Personal Ministries — Nov 20–22</option><option value="CS2026">Community Services — Nov 27–29</option></select><label>Activity</label><select disabled><option>Workshop Registration / Check-in</option></select><button id="startBtn">Start rear camera</button><button class="secondary" id="stopBtn">Stop camera</button><div id="reader"></div><label>Manual QR token (testing/fallback)</label><input id="manual" placeholder="Paste QR token"><button id="manualBtn">Process check-in</button><div id="result" role="status" aria-live="polite"></div><button class="danger" id="logoutBtn">Log out</button></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbyp1iF_YXp1UCLGyoRxySO5oFTgwypWGodDcs27fB1tttZ3g2AiEuN4ZwbDzehCMVZrbQ/exec';
let session='',officer='',scanner=null,scanning=false,busy=false;
const $=id=>document.getElementById(id);
function status(id,message,kind='error'){const e=$(id);e.textContent=message;e.className='result '+kind;}
function jsonp(action,params={}){
  return new Promise((resolve,reject)=>{
    const cb='scc_cb_'+Date.now()+'_'+Math.floor(Math.random()*1000000);
    const el=document.createElement('script');
    let done=false;
    const cleanup=()=>{clearTimeout(timer);el.remove();try{delete window[cb]}catch(e){window[cb]=undefined;}};
    const finish=(error,data)=>{if(done)return;done=true;cleanup();error?reject(error):resolve(data);};
    const timer=setTimeout(()=>finish(Error('Scanner service timed out.')),20000);
    window[cb]=data=>finish(null,data);
    const query=new URLSearchParams({mode:'api',action,callback:cb,...params});
    el.src=API_URL+'?'+query.toString();
    el.onerror=()=>finish(Error('Unable to reach Apps Script. Check deployment and internet connection.'));
    document.head.appendChild(el);
  });
}
async function login(){
  const username=$('username').value.trim(),password=$('password').value;
  if(!username||!password)return status('loginResult','Enter username and password.');
  $('loginBtn').disabled=true;status('loginResult','Checking credentials...','already');
  try{const r=await jsonp('login',{username,password});$('password').value='';
    if(!r.ok)return status('loginResult',r.message||'Login denied.');
    session=r.session;officer=r.officer.name;
    $('loginCard').style.display='none';$('scannerCard').style.display='block';
    $('officerName').textContent='Signed in: '+officer;status('result','Ready to scan.','success');
  }catch(e){status('loginResult',e.message);}finally{$('loginBtn').disabled=false;}
}
async function processScan(value){
  if(busy||!session)return;if(!value)return status('result','Scan a QR code or enter a QR token.');
  busy=true;status('result','Verifying participant...','already');
  try{const r=await jsonp('scan',{session,workshop:$('workshop').value,scanInput:value});
    const who=r.participant?(' — '+r.participant.name+' ('+r.participant.id+')'):'';
    status('result',(r.message||'Scan processed')+who,r.status==='success'?'success':r.status==='already'?'already':'error');
    if((r.message||'').includes('Session expired')){await logout();}
  }catch(e){status('result',e.message);}finally{setTimeout(()=>busy=false,1800);}
}
async function startCamera(){if(scanning)return;if(typeof Html5Qrcode==='undefined')return status('result','Camera library unavailable. Check internet connection.');
  try{scanner=scanner||new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},value=>{if(!busy)processScan(value);},()=>{});scanning=true;status('result','Camera ready. Point at a QR code.','success');}
  catch(e){status('result','Unable to start camera: '+e.message);}}
async function stopCamera(){if(scanner&&scanning){try{await scanner.stop();}catch(e){}scanning=false;}}
async function logout(){await stopCamera();const old=session;session='';officer='';$('scannerCard').style.display='none';$('loginCard').style.display='block';$('password').value='';if(old)jsonp('logout',{session:old}).catch(()=>{});}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('startBtn').onclick=startCamera;$('stopBtn').onclick=stopCamera;$('manualBtn').onclick=()=>processScan($('manual').value.trim());$('logoutBtn').onclick=logout;
status('loginResult','Checking scanner service...','already');
jsonp('ping').then(r=>status('loginResult',r.ok?'Scanner connection ready.':r.message,r.ok?'success':'error')).catch(e=>status('loginResult',e.message));
</script></body></html>
